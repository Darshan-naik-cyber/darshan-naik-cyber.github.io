---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.tags.size > 0 %} &middot; {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  <div class="prose">{{ content }}</div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">Back to all posts</a></p>
</article>
