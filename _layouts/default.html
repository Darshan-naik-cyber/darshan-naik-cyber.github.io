<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author }}</a>
    <nav aria-label="Main">
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author }}</span>
    <span class="links social-links">{% include social.html %}<a href="{{ '/feed.xml' | relative_url }}" class="social-icon"><span>RSS</span></a></span>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('img:not([loading])').forEach(function (img) {
        img.setAttribute('loading', 'lazy');
      });
    });
  </script>
</body>
</html>
