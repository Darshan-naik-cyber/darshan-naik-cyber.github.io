title: Darshan Naik
tagline: Security researcher, trainer and content creator
description: AI security and offensive security research, training and writing by Darshan Naik.
# Set to your site address. For a project repo use url + baseurl (e.g. baseurl: "/my-repo")
url: "https://darshanhackz.github.io"
baseurl: ""

author: Darshan Naik
email: darshanhackz@gmail.com

# ──────────────────────────────────────────────
# SOCIAL LINKS — fill in your handle/username or full URL.
# Leave the value as "" to hide that icon.
# ──────────────────────────────────────────────
social:
  linkedin: "darshanhackz"
  x: "darshanhackz"
  instagram: "darshanhacks"
  medium: "darshanhacks"
  topmate: "darshanhackz"
  email: "darshanhackz@gmail.com"

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/

# ──────────────────────────────────────────────
# LAYOUT DEFAULTS
# Automatically assigns a layout to every file so
# you don't have to add "layout:" in every post/page.
# ──────────────────────────────────────────────
defaults:
  # All posts in _posts/ → use layout: post
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # All other pages → use layout: page
  # (pages with their own layout: field override this)
  - scope:
      path: ""
      type: pages
    values:
      layout: page
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
